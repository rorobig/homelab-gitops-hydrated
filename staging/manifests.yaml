apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  namespace: podinfo-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: podinfo
  template:
    metadata:
      labels:
        app: podinfo
    spec:
      containers:
      - image: ghcr.io/stefanprodan/podinfo:6.15.0
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
        name: podinfo
        ports:
        - containerPort: 9898
          name: http
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
        resources:
          limits:
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo
  namespace: podinfo-staging
spec:
  ports:
  - name: http
    port: 9898
    targetPort: http
  selector:
    app: podinfo
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: podinfo
  namespace: podinfo-staging
spec:
  hostnames:
  - podinfo-staging.home.arpa
  parentRefs:
  - name: agentgateway-proxy
    namespace: agentgateway-system
    sectionName: http
  rules:
  - backendRefs:
    - name: podinfo
      port: 9898
